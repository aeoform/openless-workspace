name: Mirror release assets to OSS

# Pulls the installers from upstream and pushes them straight to OSS, where the
# download origin reads them over the free intra-region endpoint.
#
# Checks every 15 minutes. GitHub's cron is best-effort and drifts, so a run may
# land late — but `rclone copy` is idempotent, which is what makes the "failed
# run, next one continues" behaviour work: already-uploaded files are skipped
# by checksum, the rest are transferred.
#
# Retention: newest 3 stable + 3 pre-release tags of *binaries*. Manifests
# (*.json) are never pruned, so clients that still poll an old tag keep working.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mirror-release]

permissions:
  contents: read

env:
  REPO: Open-Less/openless
  MIRROR_BASE: https://dl.aeoform.com
  KEEP_STABLE: "3"
  KEEP_PRERELEASE: "3"

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags to keep
        id: tags
        run: |
          set -euo pipefail
          json=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases?per_page=50")
          stable=$(jq -r '[.[] | select(.draft == false and .prerelease == false)]
                         | sort_by(.published_at) | reverse | .[:'"${KEEP_STABLE}"'] | .[].tag_name' <<<"$json")
          # Tag names use "Beta" with a capital B.
          beta=$(jq -r '[.[] | select(.draft == false and .prerelease == true)]
                       | sort_by(.published_at) | reverse | .[:'"${KEEP_PRERELEASE}"'] | .[].tag_name' <<<"$json")
          echo "stable:"; echo "$stable"
          echo "beta:";   echo "$beta"
          { echo "$stable"; echo "$beta"; } | sed '/^$/d' | sort -u > keep.txt
          test -s keep.txt || { echo "no tags to mirror"; exit 1; }
          cat keep.txt

      - name: Fetch and stage assets
        run: |
          set -euo pipefail
          mkdir -p stage
          while read -r tag; do
            [ -n "$tag" ] || continue
            curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${tag}" \
              | jq -r '.assets[] | [.browser_download_url, .name] | @tsv' > assets.tsv
            mkdir -p "stage/${tag}"
            while IFS=$'\t' read -r url name; do
              # Asset names carry a literal "+" (e.g. OpenLess_2.0.1+build...);
              # the download URL encodes it as %2B, so keep the two apart.
              case "$name" in
                *.dmg|*.exe|*.msi|*.deb|*.rpm|*.apk|*.hap|*.sig|*.tar.gz|*.json|SHA256SUMS) ;;
                *) continue ;;
              esac
              echo "→ ${tag}/${name}"
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                -o "stage/${tag}/${name}" "$url"
            done < assets.tsv
            rm -f assets.tsv
            test -n "$(ls -A "stage/${tag}")" || { echo "empty tag ${tag}"; rmdir "stage/${tag}"; }
          done < keep.txt
          du -sh stage; ls stage

      - name: Point updater manifests at the mirror
        run: |
          set -euo pipefail
          python3 tools/rewrite-manifests.py stage "$MIRROR_BASE"

      - name: Build channel manifests
        run: |
          set -euo pipefail
          # Tag names use "Beta" with a capital B.
          stable=$(grep -vi beta keep.txt | sort -V | tail -1 || true)
          beta=$(grep -i beta keep.txt | sort -V | tail -1 || true)
          echo "stable=${stable:-none} beta=${beta:-none}"
          mkdir -p channels/stable channels/beta
          if [ -n "$stable" ]; then
            pub=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${stable}" | jq -r '.published_at')
            PUB_DATE="$pub" python3 tools/generate-manifests.py stage "$stable" stable channels/stable "$MIRROR_BASE"
          fi
          if [ -n "$beta" ]; then
            pub=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${beta}" | jq -r '.published_at')
            PUB_DATE="$pub" python3 tools/generate-manifests.py stage "$beta" beta channels/beta "$MIRROR_BASE"
          fi
          ls -l channels/stable channels/beta

      - name: Upload to OSS
        run: |
          set -euo pipefail
          test -n "${OSS_BUCKET:-}" && test -n "${OSS_AK:-}" && test -n "${OSS_SK:-}"
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          RCLONE=$(ls -d ./rclone-*-linux-amd64/rclone); chmod +x "$RCLONE"
          export RCLONE_CONFIG_OSS_TYPE=s3
          export RCLONE_CONFIG_OSS_PROVIDER=Alibaba
          export RCLONE_CONFIG_OSS_ACCESS_KEY_ID="$OSS_AK"
          export RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY="$OSS_SK"
          # Bucket stays private: only the download origin reads it.
          export RCLONE_CONFIG_OSS_ENDPOINT=oss-cn-zhangjiakou.aliyuncs.com
          # `copy`, not `sync`: existing objects are skipped by checksum, so a
          # retried run only transfers what is still missing.
          "$RCLONE" copy stage "oss:${OSS_BUCKET}/releases" \
            --checksum --transfers 4 \
            --retries 5 --retries-sleep 20s --low-level-retries 20 \
            --stats-one-line \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          "$RCLONE" copy channels/stable "oss:${OSS_BUCKET}/updates/stable" \
            --checksum --retries 5 --retries-sleep 10s --stats-one-line \
            --header-upload "Cache-Control: public, max-age=60"
          "$RCLONE" copy channels/beta "oss:${OSS_BUCKET}/updates/beta" \
            --checksum --retries 5 --retries-sleep 10s --stats-one-line \
            --header-upload "Cache-Control: public, max-age=60"

      # Best effort: pull the freshly published payloads through the CDN once so
      # the first real visitor is a cache hit instead of an origin fetch.
      - name: Prewarm the edge cache
        continue-on-error: true
        env:
          MIRROR_BASE: ${{ env.MIRROR_BASE }}
        run: |
          set -euo pipefail
          urls=$(grep -ho '"url": *"[^"]*"' channels/*/*.json | cut -d'"' -f4 | sort -u | head -20)
          test -n "$urls" || { echo "no manifest urls to prewarm"; exit 0; }
          ok=0; fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -m 300 -w "%{http_code}" "$url" || echo 000)
            case "$code" in 200|206) ok=$((ok+1)) ;; *) fail=$((fail+1)); echo "  ! $code $url" ;; esac
          done <<< "$urls"
          echo "prewarmed $ok url(s), $fail failure(s)"

      - name: Prune old binaries
        run: |
          set -euo pipefail
          RCLONE=$(ls -d ./rclone-*-linux-amd64/rclone)
          export RCLONE_CONFIG_OSS_TYPE=s3
          export RCLONE_CONFIG_OSS_PROVIDER=Alibaba
          export RCLONE_CONFIG_OSS_ACCESS_KEY_ID="$OSS_AK"
          export RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY="$OSS_SK"
          export RCLONE_CONFIG_OSS_ENDPOINT=oss-cn-zhangjiakou.aliyuncs.com
          # rclone prints directories with a trailing slash; keep.txt has bare tags.
          "$RCLONE" lsf --dirs-only "oss:${OSS_BUCKET}/releases" | sed 's:/$::' > remote.txt
          while read -r dir; do
            [ -n "$dir" ] || continue
            grep -qx "$dir" keep.txt && continue
            echo "prune ${dir}"
            "$RCLONE" purge "oss:${OSS_BUCKET}/releases/${dir}"
          done < remote.txt
          echo "kept:"; cat keep.txt
