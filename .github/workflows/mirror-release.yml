name: Mirror release assets to OSS

# GitHub Actions egress is fast; the Zhangjiakou ECS is not (≈20 KB/s from
# GitHub). So CI downloads the installers once and pushes them to OSS, where the
# ECS pulls them over the free internal endpoint and ESA caches the result.
#
# Keeps the newest 3 stable and 3 pre-release tags; older tags are pruned.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mirror-release]

permissions:
  contents: read

env:
  REPO: Open-Less/openless
  OSS_PREFIX: releases
  MIRROR_BASE: https://dl.aeoform.com
  KEEP_STABLE: "3"
  KEEP_PRERELEASE: "3"

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags to keep
        id: tags
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/releases?per_page=50"
          json=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api")
          # jq sorts by publish time descending; split stable vs pre-release.
          stable=$(jq -r '[.[] | select(.draft == false and .prerelease == false)]
                         | sort_by(.published_at) | reverse | .[:'"${KEEP_STABLE}"'] | .[].tag_name' <<<"$json")
          beta=$(jq -r '[.[] | select(.draft == false and .prerelease == true)]
                       | sort_by(.published_at) | reverse | .[:'"${KEEP_PRERELEASE}"'] | .[].tag_name' <<<"$json")
          echo "stable:"; echo "$stable"
          echo "beta:";   echo "$beta"
          { echo "$stable"; echo "$beta"; } | sed '/^$/d' | sort -u > keep.txt
          test -s keep.txt || { echo "no tags to mirror"; exit 1; }
          echo "latest=$(head -1 <<<"$stable")" >> "$GITHUB_OUTPUT"
          cat keep.txt

      - name: Fetch and stage assets
        run: |
          set -euo pipefail
          mkdir -p stage
          while read -r tag; do
            [ -n "$tag" ] || continue
            api="https://api.github.com/repos/${REPO}/releases/tags/${tag}"
            curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api" \
              | jq -r '.assets[] | [.browser_download_url, .name] | @tsv' > "assets-${tag}.tsv"
            mkdir -p "stage/${tag}"
            while IFS=$'\t' read -r url name; do
              # Asset names carry a literal "+" (e.g. OpenLess_2.0.1+build...);
              # the download URL encodes it as %2B, so keep the two apart.
              case "$name" in
                # installers, updater payloads, updater manifests, checksums
                *.dmg|*.exe|*.msi|*.deb|*.rpm|*.apk|*.hap|*.sig|*.tar.gz|*.json|SHA256SUMS) ;;
                *) continue ;;
              esac
              echo "→ ${tag}/${name}"
              curl -fsSL --retry 3 -o "stage/${tag}/${name}" "$url"
            done < "assets-${tag}.tsv"
            rm -f "assets-${tag}.tsv"
            test -n "$(ls -A "stage/${tag}")" || { echo "empty tag ${tag}"; rmdir "stage/${tag}"; }
          done < keep.txt
          du -sh stage; ls stage

      - name: Point updater manifests at the mirror
        run: |
          set -euo pipefail
          python3 tools/rewrite-manifests.py stage "$MIRROR_BASE"

      - name: Stage channel aliases
        run: |
          set -euo pipefail
          # Tag names use "Beta" with a capital B.
          grep -vi beta keep.txt | sort -V | tail -1 > stable.txt || true
          grep -i beta keep.txt | sort -V | tail -1 > beta.txt || true
          mkdir -p channels/stable channels/beta
          stable=$(cat stable.txt 2>/dev/null || echo)
          beta=$(cat beta.txt 2>/dev/null || echo)
          if [ -n "$stable" ] && [ -d "stage/$stable" ]; then
            find "stage/$stable" -maxdepth 1 -name 'latest-*.json' ! -name '*-beta*' \
              -exec cp {} channels/stable/ \;
          fi
          if [ -n "$beta" ] && [ -d "stage/$beta" ]; then
            find "stage/$beta" -maxdepth 1 -name '*-beta.json' -exec cp {} channels/beta/ \;
          fi
          echo "stable=${stable:-none} beta=${beta:-none}"
          ls -l channels/stable channels/beta
          test -n "$(ls -A channels/stable)" || { echo "no stable manifests staged"; exit 1; }

      - name: Upload to OSS
        run: |
          set -euo pipefail
          test -n "${OSS_BUCKET:-}" && test -n "${OSS_AK:-}" && test -n "${OSS_SK:-}"
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          RCLONE=$(ls -d ./rclone-*-linux-amd64/rclone); chmod +x "$RCLONE"
          export RCLONE_CONFIG_OSS_TYPE=s3
          export RCLONE_CONFIG_OSS_PROVIDER=Alibaba
          export RCLONE_CONFIG_OSS_ACCESS_KEY_ID="$OSS_AK"
          export RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY="$OSS_SK"
          # Bucket stays private: only the ECS sync (with this key) reads it.
          export RCLONE_CONFIG_OSS_ENDPOINT=oss-cn-zhangjiakou.aliyuncs.com
          # Tag directories are immutable, so let ESA keep them for a year.
          "$RCLONE" copy stage "oss:${OSS_BUCKET}/${OSS_PREFIX}" \
            --checksum --stats-one-line \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          # Channel aliases live outside releases/ and stay short-lived so a new
          # release is picked up within a minute.
          "$RCLONE" copy channels "oss:${OSS_BUCKET}/updates" \
            --checksum --stats-one-line \
            --header-upload "Cache-Control: public, max-age=60"

      - name: Prune old tags
        run: |
          set -euo pipefail
          RCLONE=$(ls -d ./rclone-*-linux-amd64/rclone)
          export RCLONE_CONFIG_OSS_TYPE=s3
          export RCLONE_CONFIG_OSS_PROVIDER=Alibaba
          export RCLONE_CONFIG_OSS_ACCESS_KEY_ID="$OSS_AK"
          export RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY="$OSS_SK"
          export RCLONE_CONFIG_OSS_ENDPOINT=oss-cn-zhangjiakou.aliyuncs.com
          # rclone prints directories with a trailing slash; keep.txt has bare tags.
          "$RCLONE" lsf --dirs-only "oss:${OSS_BUCKET}/${OSS_PREFIX}" | sed 's:/$::' > remote.txt
          grep -v '^$' remote.txt | while read -r dir; do
            if ! grep -qx "$dir" keep.txt; then
              echo "prune ${dir}"
              "$RCLONE" purge "oss:${OSS_BUCKET}/${OSS_PREFIX}/${dir}"
            fi
          done
          echo "kept:"; cat keep.txt
