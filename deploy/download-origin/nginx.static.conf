# /etc/nginx/conf.d/openless-dl.conf
# Serves mirrored release assets to ESA.
#
# Port 80 is used so the ESA origin can stay on the default HTTP port; the
# virtual host only answers for dl.aeoform.com, so the existing default_server
# (tunnel) keeps handling everything else. 8080 stays open for direct checks.
#
# The OSS bucket is private (the RAM user may not grant public ACLs), so a
# systemd timer pulls objects over the free internal endpoint:
#   oss:openless-backend/releases -> /srv/openless-dl/releases

server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name dl.aeoform.com;

    root /srv/openless-dl;
    default_type application/octet-stream;
    server_tokens off;

    # Downloads only; nothing else may be read from this host.
    location /releases/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;

        sendfile on;
        tcp_nopush on;
        aio threads;

        # Tag directories are immutable, so caches may keep them for a year.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Updater manifests: rewritten to point at this host, short TTL so a new
    # release is picked up within a minute.
    location /updates/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
