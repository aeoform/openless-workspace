# /etc/nginx/conf.d/openless-dl.conf  (mode: proxy)
#
# Nothing runs on this box except nginx. Every download is fetched on demand
# from the OSS bucket over the intra-region endpoint (no public egress charge)
# and cached on disk, so repeat downloads never leave the machine.
#
# Requires the bucket to allow anonymous GET (public-read); writes still go
# through the RAM key in CI.

proxy_cache_path /var/cache/openless-dl levels=1:2 keys_zone=openless_dl:32m
                 max_size=12g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name dl.aeoform.com;

    default_type application/octet-stream;
    server_tokens off;

    # ---- release binaries -------------------------------------------------
    location /releases/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://openless-backend.oss-cn-zhangjiakou-internal.aliyuncs.com/releases/;
        proxy_http_version 1.1;
        proxy_set_header Host openless-backend.oss-cn-zhangjiakou-internal.aliyuncs.com;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_cache openless_dl;
        proxy_cache_key "$uri";
        # Tag paths are immutable: cache for a month, serve stale on hiccups.
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header x-oss-request-id;
        proxy_hide_header x-oss-server-time;

        add_header X-DL-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- updater manifests (short TTL, must not be stale) -----------------
    location /updates/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://openless-backend.oss-cn-zhangjiakou-internal.aliyuncs.com/updates/;
        proxy_http_version 1.1;
        proxy_set_header Host openless-backend.oss-cn-zhangjiakou-internal.aliyuncs.com;

        proxy_cache openless_dl;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header x-oss-request-id;

        add_header X-DL-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
