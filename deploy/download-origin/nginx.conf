# /etc/nginx/conf.d/openless-dl.conf
# Serves mirrored release assets to ESA. Objects live in OSS (same region), so
# the first request per file costs one free internal transfer, later requests
# are served from this disk cache.
#
# Replace __BUCKET__ with the OSS bucket name before installing.

proxy_cache_path /var/cache/openless-dl levels=1:2 keys_zone=openless_dl:32m
                 max_size=8g inactive=30d use_temp_path=off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Only release files are exposed; nothing else on this host.
    location /releases/ {
        proxy_pass https://__BUCKET__.oss-cn-zhangjiakou-internal.aliyuncs.com/releases/;
        proxy_http_version 1.1;
        proxy_set_header Host __BUCKET__.oss-cn-zhangjiakou-internal.aliyuncs.com;

        proxy_cache openless_dl;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;

        proxy_hide_header x-oss-request-id;
        proxy_hide_header x-oss-server-time;
        add_header X-DL-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
