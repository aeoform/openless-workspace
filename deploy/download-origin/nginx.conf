# /etc/nginx/conf.d/openless-dl.conf
# Serves mirrored release assets to ESA from local disk.
#
# The OSS bucket is private (the RAM user we have may not grant public ACLs), so
# a systemd timer pulls objects over the free internal endpoint:
#   oss:openless-backend/releases -> /srv/openless-dl/releases
# nginx then serves them with Range support and a immutable cache header.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/openless-dl;
    default_type application/octet-stream;

    # Files are content-addressed by tag, so they never change in place.
    location /releases/ {
        try_files $uri =404;
        sendfile on;
        tcp_nopush on;
        aio threads;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
